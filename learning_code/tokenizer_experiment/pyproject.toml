[project]
name = "tokenizer-experiment"
version = "0.1.0"
description = "Independent benchmark scaffold for CPU/GPU tokenizer parallelization experiments."
requires-python = ">=3.11"
dependencies = [
  "regex>=2024.0.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 100
target-version = "py311"
